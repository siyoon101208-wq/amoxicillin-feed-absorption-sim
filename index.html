<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>청람색 소실 시간 실험</title><style>body{margin:0;background:#e7edf1;font:16px Arial;color:#26343d}.app{max-width:980px;margin:auto;padding:20px}.bench{position:relative;height:450px;background:linear-gradient(145deg,#fff,#dfe5e8);border:1px solid #9eabb3;overflow:hidden}.tray{position:absolute;left:15px;top:30px;width:220px;z-index:5}.item{background:#fff;border:2px solid #abb6bd;border-radius:8px;padding:7px;margin:5px 0;width:175px;cursor:grab;font-weight:bold}.item i{display:inline-block;width:15px;height:15px;border-radius:50%;margin-right:7px;vertical-align:middle}.dry{background:#895b32}.wet{background:#53b7d5}.drug{background:#304dff}.acid{background:#d95355}.base{background:#4c9e76}.reagent{background:#e58a42}.neck{position:absolute;left:44%;top:58px;width:170px;height:65px;border:5px solid #8ac4e6;border-bottom:0;background:#d9f8fa66}.jar{position:absolute;left:41%;top:115px;width:210px;height:245px;border:5px solid #83b8d5;border-top:0;border-radius:0 0 28px 28px;background:#d9f5f7;box-shadow:inset -15px 0 15px #5799b533;transition:background .25s}.mix{position:absolute;left:46%;top:200px;width:60px;display:flex;flex-wrap:wrap;gap:3px;z-index:3}.mix i{width:14px;height:14px;border-radius:50%}.stick{position:absolute;left:49%;top:160px;width:12px;height:150px;background:linear-gradient(90deg,#633,#d89b55,#633);z-index:6;cursor:grab}.ph{position:absolute;right:25px;top:30px;background:white;border:2px solid #8997a1;border-radius:9px;padding:10px;line-height:1.7}.ph b{color:#2756d8;font-size:21px}.msg{position:absolute;left:36%;bottom:13px;background:white;padding:8px;border-radius:7px;font-weight:bold;z-index:8}.controls{background:white;padding:13px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}.btn{background:#2d5cff;color:white;border:0;border-radius:7px;padding:10px 14px;font-weight:bold}.result{font-size:18px;color:#2d5cff}.note{font-size:13px;color:#64737d}@media(max-width:700px){.jar{left:34%}.neck{left:37%}.mix{left:44%}.stick{left:47%}.msg{left:25%}}</style><main class="app"><h1>🧪 전분-아이오딘 청람색 소실 실험</h1><p>전분시액과 아이오딘-아이오딘화 칼륨 용액을 넣은 뒤, 청람색이 연한 하늘색으로 바뀌는 시간을 비교합니다.</p><section class="bench"><div class="tray"><b>재료</b><div class="item" draggable="true" data-k="dry"><i class="dry"></i>건식 사료 알갱이</div><div class="item" draggable="true" data-k="wet"><i class="wet"></i>습식 사료 알갱이</div><div class="item" draggable="true" data-k="drug"><i class="drug"></i>항생제</div><div class="item" draggable="true" data-k="acid"><i class="acid"></i>산성용액</div><div class="item" draggable="true" data-k="base"><i class="base"></i>염기성 용액</div><div class="item" draggable="true" data-k="starch"><i class="reagent"></i>전분시액</div><div class="item" draggable="true" data-k="iodine"><i class="reagent"></i>아이오딘-아이오딘화 칼륨</div></div><div class="ph">현재 pH <b id="p">7</b><br>목표 pH <b id="g">-</b></div><div class="neck"></div><div id="jar" class="jar"></div><div id="mix" class="mix"></div><div id="stick" class="stick"></div><div id="msg" class="msg">사료 알갱이와 항생제를 넣으세요</div></section><section class="controls"><label>관찰 시간 <b id="tv">0</b>초<br><input id="time" type="range" min="0" max="10" value="0"></label><button id="next" class="btn">다음 단계</button><button id="reset" class="btn">초기화</button><span>결과: <b id="result" class="result">-</b></span></section><p class="note">검출 단계에서 청람색이 먼저 나타난 뒤 연한 하늘색으로 변합니다. 건식 조건은 보존된 항생제가 더 많다는 가설로, 청람색 소실 시간이 더 짧게 설정되어 있습니다.</p></main><script>let a=[],s=0,p=7,drag=false,blueTimer;const m=document.querySelector('#mix'),jar=document.querySelector('#jar'),msg=document.querySelector('#msg'),steps=['사료 알갱이와 항생제를 넣으세요','산성용액으로 pH 2를 만드세요','산성 반응을 관찰하세요','염기성 용액으로 pH 6을 만드세요','중화 반응을 관찰하세요','전분시액과 아이오딘-아이오딘화 칼륨 용액을 각각 넣으세요'];function ui(){document.querySelector('#p').textContent=p;document.querySelector('#g').textContent=s==1||s==2?2:s==3||s==4?6:'-';if(s<6)msg.textContent=steps[s]}document.querySelectorAll('.item').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('k',x.dataset.k));document.querySelector('.bench').ondragover=e=>e.preventDefault();document.querySelector('.bench').ondrop=e=>{let k=e.dataTransfer.getData('k');if(!k)return;if((k==='dry'||k==='wet'||k==='drug')&&s!==0){msg.textContent='현재 단계에서는 넣을 수 없습니다';return}if(k==='acid'||k==='base'){if((k==='acid'&&s!==1)||(k==='base'&&s!==3)){msg.textContent='현재 단계에서는 이 용액을 넣을 수 없습니다';return}p+=k==='acid'?-1:1;ui();msg.textContent='용액 1회분 소모 · 현재 pH '+p;return}if((k==='starch'||k==='iodine')&&s!==5){msg.textContent='검출 단계에서 넣으세요';return}if(a.includes(k)){msg.textContent='이미 넣은 재료입니다';return}a.push(k);if(k!=='starch'&&k!=='iodine'){let i=document.createElement('i');i.className=k;m.append(i)}if(k==='starch'||k==='iodine')msg.textContent='용액이 소모되었습니다. 두 용액을 모두 넣으세요';else msg.textContent='알갱이 하나가 들어왔습니다';if(s===5&&a.includes('starch')&&a.includes('iodine'))startTest()};time.oninput=()=>tv.textContent=time.value;next.onclick=()=>{if(s===0&&(!a.some(x=>x==='dry'||x==='wet')||!a.includes('drug'))){msg.textContent='사료와 항생제를 먼저 넣으세요';return}if(s===1&&p!==2){msg.textContent='pH 2가 될 때까지 산성용액을 넣으세요';return}if(s===2&&+time.value<3){msg.textContent='관찰 시간을 3초까지 진행하세요';return}if(s===3&&p!==6){msg.textContent='pH 6이 될 때까지 염기성 용액을 넣으세요';return}if(s===4&&+time.value<6){msg.textContent='관찰 시간을 6초까지 진행하세요';return}if(s===5&&(!a.includes('starch')||!a.includes('iodine'))){msg.textContent='전분시액과 아이오딘 용액을 모두 넣으세요';return}s++;ui()};function startTest(){clearTimeout(blueTimer);jar.style.background='#234bff';msg.textContent='청람색이 나타났습니다. 연한 하늘색으로 변하는 시간을 관찰하세요';let dry=a.includes('dry'),dur=dry?1800:4200,t0=Date.now();function fade(){let q=Math.min(1,(Date.now()-t0)/dur);jar.style.background='rgb('+Math.round(35+155*q)+','+Math.round(75+160*q)+','+Math.round(255-10*q)+')';if(q<1)blueTimer=setTimeout(fade,40);else{result.textContent=(dry?'건식':'습식')+' · 청람색 소실 '+(dur/1000).toFixed(1)+'초 · 잔존량 '+(dry?'높음':'낮음');msg.textContent='색이 연한 하늘색으로 변했습니다. 시간 차이를 비교하세요'}}fade()}stick.onpointerdown=e=>{drag=true;stick.setPointerCapture(e.pointerId)};stick.onpointerup=e=>{drag=false;stick.releasePointerCapture(e.pointerId)};stick.onpointermove=e=>{if(!drag)return;let r=document.querySelector('.bench').getBoundingClientRect();stick.style.left=Math.max(350,Math.min(650,e.clientX-r.left-6))+'px';stick.style.top=Math.max(140,Math.min(300,e.clientY-r.top-70))+'px'};reset.onclick=()=>location.reload();ui();</script></html>
